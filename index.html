<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="estilos.css">
    <title>Dashboard de Torneos Gamer</title>
</head>
<body>
    <section id="Torneos">
    <h2>Registro de Torneo</h2>

    <input type="text" id="NombreT" placeholder="Nombre del Torneo">
     <p id="errorNombre" class="error"></p>
    <label for="categoria">Categoría:</label>
                <select id="categoria">
                    <option value="">Selecciona una categoría</option>
                    <option value="Lucha">Lucha</option>
                    <option value="Estrategia">Estrategia</option>
                    <option value="Arcade">Arcade</option>
                    <option value="Deportes">Deportes</option>
                    <option value="Aventura">Aventura</option>
                </select>
            <p id="errorCategoria" class="error"></p>

    <input type="number" id="Participantes" placeholder="numero de Participantes">
    <p id="errorParticipante" class="error"></p>
    <input type="number" id="valordeins" placeholder="valor de inscripcion">
    <p id="errorValor" class="error"></p>
    <input type="text" id="email" placeholder="email del organizador">
    <p id="errorEmail" class="error"></p>

    <br>
    <button onclick="registrarTorneo()">REGISTRAR TORNEO</button>
    <p id="mensajeGeneral"></p>
    <button onclick="limpiarFormulario()">Reiniciar</button>

    <table>
        <thead>
            <tr>
                <th>Nombre del 
                    torneo</th>
                <th>Categoría</th>
                <th>Participantes</th>
                <th>Valor de inscripcion</th>
                <th>email</th>
                <th>recaudación</th>
               
                </tr>
        </thead>
        <tbody id="tablaTorneo">
        </tbody>
    </table>
    
    
    
    
    
    <script src="dashboard.js"></script>
    <script src="utilitarios.js"></script>
    
</body>
</html>
